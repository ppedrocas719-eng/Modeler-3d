<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mini Modeler 3D</title>
<style>
:root{--bg:#101216;--pn:#181b21;--bd:#2a2f38;--tx:#e8eaee;--mu:#8b93a1;--ac:#ffb020;--ao:#1a1200}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:var(--tx);background:transparent;border:0;border-radius:8px;cursor:pointer;padding:0}
.pn{position:fixed;background:var(--pn);border:1px solid var(--bd);border-radius:10px}
.ib{min-width:46px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--mu);flex:none}
.ib svg{width:20px;height:20px}
.ib.on{background:var(--ac);color:var(--ao)}
.ib:active{background:#ffffff18}
.sep{width:1px;align-self:stretch;margin:6px 3px;background:var(--bd);flex:none}
#top{position:fixed;top:0;left:0;right:0;height:46px;background:var(--pn);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:0 6px;z-index:3}
#top .gap{flex:1}
#pname{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px;height:34px;font-weight:700;font-size:12px;flex:none;background:#0d0f12}
#sv{color:var(--mu);font-size:10px;flex:none;min-width:48px;text-align:right}
.sg{display:flex;background:#0d0f12;border-radius:8px;padding:2px;flex:none}
.sg button{padding:0 11px;height:34px;font-size:12px;font-weight:600;color:var(--mu)}
.sg button.on{background:var(--ac);color:var(--ao)}
.exp{height:34px;padding:0 14px;background:var(--ac);color:var(--ao);font-weight:700;font-size:12px;flex:none}
#rail{position:fixed;top:46px;left:0;bottom:0;width:58px;background:var(--pn);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;overflow:auto;z-index:2}
#rail .sep{width:30px;height:1px;margin:4px 0;align-self:center}
#ctx{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);max-width:calc(100% - 150px);display:flex;align-items:center;gap:2px;padding:4px;overflow-x:auto;z-index:2}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);flex:none;margin:0 3px}
.sw.on{border-color:#fff}
#ctx input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;flex:none}
.sl{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:11px;flex:none;padding:0 6px}
.sl input{width:110px;accent-color:var(--ac)}
#views{position:fixed;top:54px;right:6px;display:flex;flex-direction:column;gap:2px;padding:3px;z-index:2}
#views button{width:50px;height:34px;font-size:11px;color:var(--mu)}
#prop{top:54px;right:64px;width:204px;padding:8px;display:none;flex-direction:column;gap:8px;max-height:calc(100% - 130px);overflow:auto;z-index:2}
#prop.open{display:flex}
.h{font-size:10px;font-weight:700;color:var(--mu);letter-spacing:.6px;text-transform:uppercase}
.r{display:grid;grid-template-columns:26px repeat(3,1fr);gap:3px;align-items:center;font-size:11px;color:var(--mu);margin-top:3px}
.r input,.box input[type=text]{width:100%;height:28px;background:#0d0f12;border:1px solid var(--bd);border-radius:6px;color:var(--tx);padding:0 4px;font:inherit;-webkit-user-select:text;user-select:text}
.f{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;font-size:11px;color:var(--mu)}
.f input[type=color]{width:100%;height:28px;border:1px solid var(--bd);padding:0;background:none;border-radius:6px}
#sheet{bottom:70px;left:50%;transform:translateX(-50%);display:none;grid-template-columns:repeat(4,72px);gap:6px;padding:8px;z-index:3;max-width:calc(100% - 140px)}
#sheet.on{display:grid}
#sheet .hint{grid-column:1/-1;color:var(--mu);font-size:11px}
.tile{height:62px;border-radius:8px;border:1px solid var(--bd);background-size:80px;background-position:center;display:flex;align-items:flex-end;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000,0 0 4px #000;padding-bottom:4px}
#hud{position:fixed;display:none;background:#000d;border:1px solid var(--ac);color:var(--ac);padding:3px 8px;border-radius:6px;pointer-events:none;font-weight:700;z-index:5}
#toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--pn);border:1px solid var(--bd);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
#rot{display:none;position:fixed;top:56px;left:70px;background:var(--pn);border:1px solid var(--bd);padding:6px 10px;border-radius:8px;color:var(--mu);pointer-events:none;z-index:4}
@media (orientation:portrait){#rot{display:block}}
#home{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;overflow:auto;padding:14px}
#home.on{display:flex}
.hh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hh h1{margin:0;font-size:20px;flex:1;min-width:150px}
.big{height:48px;padding:0 22px;background:var(--ac);color:var(--ao);font-weight:800;font-size:15px;border-radius:10px;display:flex;align-items:center;gap:8px}
.big svg{width:20px;height:20px}
.big.alt{background:#ffffff14;color:var(--tx)}
.sec{font-size:11px;font-weight:700;color:var(--mu);letter-spacing:.6px;text-transform:uppercase;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:10px;overflow:hidden;position:relative;cursor:pointer}
.card img{width:100%;aspect-ratio:1.6;object-fit:cover;display:block;background:#0d0f12}
.card .nm{padding:7px 8px 0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt{padding:2px 8px 8px;color:var(--mu);font-size:11px}
.card .x{position:absolute;top:4px;right:4px;width:30px;height:30px;background:#000b;border-radius:8px;display:grid;place-items:center}
.card .x svg{width:16px;height:16px}
#modal{position:fixed;inset:0;background:#000a;z-index:40;display:none;align-items:center;justify-content:center;padding:10px}
#modal.on{display:flex}
.box{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:14px;width:min(430px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box input[type=text]{height:40px;font-size:14px;padding:0 10px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bt{height:40px;padding:0 14px;background:#ffffff14;border-radius:8px;font-weight:700;flex:1;min-width:110px}
.bt.ac{background:var(--ac);color:var(--ao)}
.note{color:var(--mu);font-size:11px;line-height:1.4;min-height:16px;word-break:break-all}
.csw{width:100%;height:28px;border:1px solid var(--bd);border-radius:6px;display:block}
.f input[type=range]{width:100%;accent-color:var(--ac)}
#cs,#ch{width:100%;touch-action:none;border-radius:8px;display:block}
#cs{height:160px}#ch{height:22px}
.cprev{width:44px;height:36px;border-radius:8px;border:1px solid var(--bd);flex:none}
.chip{height:30px;padding:0 12px;border-radius:15px;background:#ffffff14;font-weight:700;font-size:11px;flex:none;display:inline-flex;align-items:center}
.chip.on{background:var(--ac);color:var(--ao)}
.rs{width:26px;height:26px;border-radius:6px;border:1px solid var(--bd);flex:none}
textarea{width:100%;min-height:96px;background:#0d0f12;border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:8px;font:11px ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text}
#shp{position:fixed;top:54px;right:64px;width:268px;padding:8px;display:none;flex-direction:column;gap:8px;max-height:calc(100% - 70px);overflow:auto;z-index:2}
#shp.on{display:flex}
</style>
</head>
<body>
<div id="top"></div>
<div id="rail"></div>
<div class="pn" id="ctx"></div>
<div class="pn" id="sheet"></div>
<div class="pn" id="views"></div>
<div class="pn" id="prop">
 <div class="h">Transformação</div><div id="tr"></div>
 <div class="h">Material base</div>
 <div class="f">Cor<button class="csw" id="colb"></button></div>
</div>
<div class="pn" id="shp"></div>
<div id="hud"></div><div id="toast"></div>
<div id="rot">Gire o aparelho para paisagem</div>
<div id="home"></div>
<div id="modal"></div>

function ib(label,icon,fn){const b=document.createElement('button');b.className='ib';b.innerHTML=ic(I[icon])+(label?'<span>'+label+'</span>':'');b.onclick=fn;return b}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,2600)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- modais ---------- */
function modal(html){const m=$('#modal');m.innerHTML='<div class="box">'+html+'</div>';m.classList.add('on');return m.firstChild}
function closeModal(){$('#modal').classList.remove('on');$('#modal').innerHTML=''}
function askText(title,val,ok,cb){const b=modal(`<div class="h">${esc(title)}</div><input type="text" id="mi" maxlength="40" value="${esc(val)}"><div class="row"><button class="bt" id="mc">Cancelar</button><button class="bt ac" id="mo">${esc(ok)}</button></div>`);
 const go=()=>{const v=b.querySelector('#mi').value.trim();closeModal();cb(v)};b.querySelector('#mc').onclick=closeModal;b.querySelector('#mo').onclick=go;b.querySelector('#mi').onkeydown=e=>{if(e.key=='Enter')go()}}
function askYes(title,ok,cb){const b=modal(`<div class="h">${esc(title)}</div><div class="row"><button class="bt" id="mc">Cancelar</button><button class="bt ac" id="mo">${esc(ok)}</button></div>`);b.querySelector('#mc').onclick=closeModal;b.querySelector('#mo').onclick=()=>{closeModal();cb()}}

/* ---------- seletor de cor (HSV) ---------- */
let REC=[];try{REC=JSON.parse(localStorage.getItem('mm3dRec')||'[]')}catch(e){}

 const b=modal(`<div class="h">Seletor de cor</div><canvas id="cs" width="300" height="180"></canvas><canvas id="ch" width="300" height="24"></canvas><div class="row" style="flex-wrap:nowrap"><div class="cprev" id="cp"></div><input type="text" id="cx" maxlength="7" style="flex:1"><button class="bt" id="ce" style="flex:none;min-width:100px">Conta-gotas</button></div><div class="row" id="cr"></div><div class="row"><button class="bt" id="cc">Cancelar</button><button class="bt ac" id="co">OK</button></div>`);
 const cs=b.querySelector('#cs'),ch=b.querySelector('#ch'),a=cs.getContext('2d'),c2=ch.getContext('2d'),inp=b.querySelector('#cx'),pv=b.querySelector('#cp');

 drag(cs,(x,y)=>{s=x;v=1-y;draw()});drag(ch,x=>{h=x*360;draw()});
 inp.oninput=()=>{if(/^#[0-9a-fA-F]{6}$/.test(inp.value)){const t=hex2hsv(inp.value.toLowerCase());h=t[0];s=t[1];v=t[2];draw()}};
 const rc=b.querySelector('#cr');REC.forEach(x=>{const d=document.createElement('button');d.className='rs';d.style.background=x;d.onclick=()=>{const t=hex2hsv(x);h=t[0];s=t[1];v=t[2];draw()};rc.appendChild(d)});
 const fin=ok=>{if(ok){REC=[hex,...REC.filter(x=>x!=hex)].slice(0,12);try{localStorage.setItem('mm3dRec',JSON.stringify(REC))}catch(e){}}else if(onCh)onCh(orig);closeModal();if(onDone)onDone()};
 b.querySelector('#cc').onclick=()=>fin(false);b.querySelector('#co').onclick=()=>fin(true);
 b.querySelector('#ce').onclick=()=>{closeModal();toast('Toque no modelo para capturar a cor');S.eyeCb=x=>{if(onCh)onCh(x);pickColor(x,onCh,onDone)}};
 draw()}

/* ---------- cena e câmera ---------- */
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);

const scene=new THREE.Scene();scene.background=new THREE.Color(0x14171c);
const cam=new THREE.PerspectiveCamera(50,1,.04,400),root=new THREE.Group();scene.add(root);

const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(4,8,5);scene.add(dl);
const grid=new THREE.GridHelper(40,40,0x3a4250,0x23282f);scene.add(grid);
{const l=(a,b,c)=>{const g=new THREE.BufferGeometry().setFromPoints([new V3(...a),new V3(...b)]);scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:c})))};l([-20,.002,0],[20,.002,0],0x8f3a3a);l([0,.002,-20],[0,.002,20],0x3a5a8f)}
let tg=new V3(0,.5,0),tgG=tg.clone(),th=.8,ph=1.1,rad=7,thG=th,phG=ph,radG=rad;
function updCam(){const k=.25;th+=(thG-th)*k;ph+=(phG-ph)*k;rad+=(radG-rad)*k;tg.lerp(tgG,k);
 cam.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tg);cam.updateMatrixWorld()}
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}

 req(mode,fn){return new Promise((res,rej)=>{const r=fn(this.db.transaction('p',mode).objectStore('p'));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 put(v){return this.req('readwrite',s=>s.put(v))},all(){return this.req('readonly',s=>s.getAll())},get(id){return this.req('readonly',s=>s.get(id))},del(id){return this.req('readwrite',s=>s.delete(id))}};
function serialize(){return{objs:root.children.map(o=>{const u=o.userData,pm=u.pm;return{n:o.name,pm:{v:pm.v,f:pm.f,m:pm.m,uv:u.tex?pm.uv:null},p:o.position.toArray(),q:o.quaternion.toArray(),s:o.scale.toArray(),col:u.col,sm:!!u.smooth,sh:u.sh||{}}})}}
function thumb(){const g=G.visible,ov=OV.visible,gr=grid.visible;G.visible=false;OV.visible=false;R.render(scene,cam);const c=document.createElement('canvas');c.width=240;c.height=150;const x=c.getContext('2d'),s=R.domElement,ar=240/150;let sw=s.width,sh=s.height;if(sw/sh>ar)sw=sh*ar;else sh=sw/ar;
 x.fillStyle='#14171c';x.fillRect(0,0,240,150);x.drawImage(s,(s.width-sw)/2,(s.height-sh)/2,sw,sh,0,0,240,150);G.visible=g;OV.visible=ov;grid.visible=gr;return c.toDataURL('image/jpeg',.6)}
const toBlob=c=>new Promise(r=>c.toBlob(b=>r(b),'image/png'));
async function saveNow(){if(!cur||loading||!DB.db)return;dirty=false;try{const data=JSON.parse(JSON.stringify(serialize())),tex=await Promise.all(root.children.map(o=>o.userData.tex?toBlob(o.userData.cx.canvas):null));
 await DB.put({id:cur.id,name:cur.name,updated:Date.now(),thumb:thumb(),data,tex});$('#sv').textContent='Salvo'}catch(e){dirty=true;$('#sv').textContent='Erro'}}
setInterval(()=>{if(dirty)saveNow()},3000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)saveNow()});addEventListener('pagehide',()=>{if(dirty)saveNow()});
function clearScene(){S.sel=null;S.vs=new Set();S.mode='obj';S.sheet=false;root.children.slice().forEach(o=>{root.remove(o);o.geometry.dispose();if(o.userData.tex)o.userData.tex.dispose()});US.length=RS.length=PC.length=0;updOv();updG();renderShader()}
async function loadRec(rec){loading=true;clearScene();cur={id:rec.id,name:rec.name};
 for(let i=0;i<rec.data.objs.length;i++){const d=rec.data.objs[i],pm=cl({v:d.pm.v,f:d.pm.f,m:d.pm.m,uv:d.pm.uv}),o=mkObj(pm,d.col);o.name=d.n;o.userData.smooth=d.sm;o.userData.sh=d.sh||{};syncAll(o);o.position.fromArray(d.p);o.quaternion.fromArray(d.q);o.scale.fromArray(d.s);
  const bl=rec.tex&&rec.tex[i];if(bl&&pm.uv){try{const im=await createImageBitmap(bl),c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);texFromCanvas(o,c)}catch(e){}}
  build(o);root.add(o)}
 oc=root.children.length+100;frameAll(true);loading=false;dirty=false;ui();renderCtx();renderShader();$('#sv').textContent='Salvo'}
function newScene(){clearScene();const m=mkObj(MK.cube(),'#d1d5db');m.position.set(0,.5,0);root.add(m);setSel(m)}

/* ---------- modelos prontos ---------- */
function put(pm,x,y,z,col,mat,fn){const m=mkObj(pm,col||'#d1d5db');m.position.set(x,y,z);if(mat)pm.m=pm.f.map((_,i)=>(fn?fn(i,pm):mat));root.add(m);fin(m);return m}
const TPL={
 'Barril':(x=0,z=0)=>{put(mkLathe(barrelProf,16),x,.6,z,'#8b5a2b','wood',i=>i<128&&[1,6].includes(Math.floor(i/16))?'iron':'wood')},
 'Caixa':(x=0,z=0)=>{put(mkBox(1.1,1.1,1.1),x,.55,z,'#8b5a2b','wood');put(mkBox(1.16,.12,1.16),x,.2,z,'#777777','iron');put(mkBox(1.16,.12,1.16),x,.9,z,'#777777','iron')},
 'Árvore':(x=0,z=0)=>{put(mkCyl(.18,1.4,10),x,.7,z,'#8b5a2b','wood');put(mkSphere(.85,14,9),x,1.9,z,'#3f8f3a','grass');put(mkSphere(.55,12,8),x+.5,1.5,z+.2,'#3f8f3a','grass')},
 'Cabana':(x=0,z=0)=>{put(mkBox(2.2,1.2,1.8),x,.6,z,'#888888','stone');const r=put(mkCone(1.7,.9,4),x,1.65,z,'#a14a3a','brick');r.rotation.y=Math.PI/4;put(mkBox(.4,.8,.06),x,.4,z+.92,'#8b5a2b','wood');put(mkBox(.5,.4,.06),x+.7,.7,z+.92,'#cfe9f7','glass');put(mkBox(.3,.7,.3),x-.7,1.9,z-.3,'#888888','stone')},
 'Chão':(x=0,z=0)=>{put(mkBox(8,.1,8),x,-.05,z,'#3f8f3a','grass')}};
const SEEDS=[['Barril',()=>TPL.Barril()],['Caixa',()=>TPL.Caixa()],['Árvore',()=>{TPL.Chão();TPL.Árvore()}],['Cabana',()=>{TPL.Chão();TPL.Cabana()}],['Vila de exemplo',()=>{TPL.Chão();TPL.Cabana(0,0);TPL.Árvore(3,1);TPL.Barril(-2,1.8);TPL.Caixa(-3.2,.8)}]];
async function seed(){for(const[n,fn]of SEEDS){loading=true;clearScene();fn();frameAll(true);const id='s'+Date.now()+Math.random().toString(36).slice(2,6);cur={id,name:n};loading=false;await saveNow();await new Promise(r=>setTimeout(r,20))}clearScene();cur=null}

/* ---------- menu inicial (Play / Places) ---------- */
function fdate(t){const d=new Date(t);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
async function renderHome(){const h=$('#home');let list=[];try{list=await DB.all()}catch(e){}list.sort((a,b)=>b.updated-a.updated);
 h.innerHTML=`<div class="hh"><h1>Mini Modeler 3D</h1><button class="big" id="hp">${ic(I.play)}Play</button><button class="big alt" id="hn">${ic(I.plus)}Novo place</button></div><div class="note" style="margin-top:6px">Tudo é salvo sozinho neste aparelho. Toque em Play para continuar de onde parou.</div><div class="sec">Meus places</div><div class="grid" id="hg"></div>`;
 const g=h.querySelector('#hg');list.forEach(r=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<img src="${r.thumb||''}" alt=""><div class="nm">${esc(r.name)}</div><div class="dt">${fdate(r.updated)} · ${r.data.objs.length} obj</div><button class="x">${ic(I.x)}</button>`;
  c.onclick=()=>openPlace(r.id);c.querySelector('.x').onclick=ev=>{ev.stopPropagation();askYes('Excluir "'+r.name+'"?','Excluir',async()=>{try{await DB.del(r.id)}catch(e){}renderHome()})};g.appendChild(c)});
 h.querySelector('#hp').onclick=()=>list.length?openPlace(list[0].id):newPlace('Meu place');
 h.querySelector('#hn').onclick=()=>askText('Nome do novo place','Meu place','Criar',v=>newPlace(v||'Meu place'))}
async function goHome(){if(dirty)await saveNow();$('#home').classList.add('on');renderHome()}
async function openPlace(id){const rec=await DB.get(id);if(!rec){toast('Place não encontrado');return}$('#home').classList.remove('on');await loadRec(rec)}
async function newPlace(name){$('#home').classList.remove('on');newScene();cur={id:'p'+Date.now(),name};ui();await saveNow()}

addEventListener('keydown',e=>{if(/INPUT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if(e.ctrlKey||e.metaKey){if(k=='z'){e.preventDefault();e.shiftKey?redo():undo()}if(k=='y'){e.preventDefault();redo()}return}
 if(k=='w')tool('move');else if(k=='e'&&e.altKey)extrude();else if(k=='e')tool('rot');else if(k=='r')tool('scale');else if(k=='f')focus();else if(k=='p')setMode(S.mode=='paint'?'obj':'paint');
 else if(k=='x'){S.orient=(S.orient+1)%(S.mode=='edit'?3:2);updG();ui()}else if(k=='tab'){e.preventDefault();setMode(S.mode=='edit'?'obj':'edit')}
 else if(k=='delete'||k=='backspace')S.mode=='edit'?delF():delObj();else if(k=='escape'){D?cancelDrag():(S.mode!='obj'?setMode('obj'):setSel(null))}});

/* ---------- loop ---------- */
function loop(){requestAnimationFrame(loop);updCam();updG();
 if(S.sel){OV.matrix.copy(S.sel.matrixWorld);OV.matrixWorldNeedsUpdate=true;scaleDots()}
 root.children.forEach(o=>{if(o.userData.dirty){o.userData.tex.needsUpdate=true;o.userData.dirty=false}});
 if(S.sel&&S.mode!='edit'&&$('#prop').classList.contains('open'))TR.forEach((t,r)=>[...'xyz'].forEach((k,j)=>{const i=INP[r][j];if(document.activeElement!==i){const v=(+t[1](S.sel,k)).toFixed(2);if(i.value!==v)i.value=v}}));
 fxT.value=performance.now()/1000%3600;R.render(scene,cam)}
if(innerHeight>520)$('#prop').classList.add('open');
renderCtx();ui();loop();
(async()=>{let ok=true;try{await DB.open()}catch(e){ok=false}
 if(!ok){toast('Salvamento automático indisponível neste navegador');newScene();cur={id:'tmp',name:'Meu place'};ui();return}
 let list=[];try{list=await DB.all()}catch(e){}
 if(!list.length){$('#home').classList.add('on');$('#home').innerHTML='<div class="hh"><h1>Preparando seus places de exemplo...</h1></div>';await seed()}
 $('#home').classList.add('on');renderHome()})();
</script>
