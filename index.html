<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mini Modeler 3D</title>
<style>
:root{--bg:#101216;--pn:#181b21;--bd:#2a2f38;--tx:#e8eaee;--mu:#8b93a1;--ac:#ffb020;--ao:#1a1200}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:var(--tx);background:transparent;border:0;border-radius:8px;cursor:pointer;padding:0}
.pn{position:fixed;background:var(--pn);border:1px solid var(--bd);border-radius:10px}
.ib{min-width:46px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--mu);flex:none}
.ib svg{width:20px;height:20px}
.ib.on{background:var(--ac);color:var(--ao)}
.ib:active{background:#ffffff18}
.sep{width:1px;align-self:stretch;margin:6px 3px;background:var(--bd);flex:none}
#top{position:fixed;top:0;left:0;right:0;height:46px;background:var(--pn);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:0 6px;z-index:3}
#top .gap{flex:1}
.sg{display:flex;background:#0d0f12;border-radius:8px;padding:2px;flex:none}
.sg button{padding:0 12px;height:34px;font-size:12px;font-weight:600;color:var(--mu)}
.sg button.on{background:var(--ac);color:var(--ao)}
.exp{height:34px;padding:0 14px;background:var(--ac);color:var(--ao);font-weight:700;font-size:12px;flex:none}
#rail{position:fixed;top:46px;left:0;bottom:0;width:58px;background:var(--pn);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;overflow:auto;z-index:2}
#rail .sep{width:30px;height:1px;margin:4px 0;align-self:center}
#ctx{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);max-width:calc(100% - 150px);display:flex;align-items:center;gap:2px;padding:4px;overflow-x:auto;z-index:2}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);flex:none;margin:0 3px}
.sw.on{border-color:#fff}
#ctx input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;flex:none}
.sl{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:11px;flex:none;padding:0 6px}
.sl input{width:110px;accent-color:var(--ac)}
#views{position:fixed;top:54px;right:6px;display:flex;flex-direction:column;gap:2px;padding:3px;z-index:2}
#views button{width:50px;height:34px;font-size:11px;color:var(--mu)}
#prop{top:54px;right:64px;width:204px;padding:8px;display:none;flex-direction:column;gap:8px;max-height:calc(100% - 130px);overflow:auto;z-index:2}
#prop.open{display:flex}
.h{font-size:10px;font-weight:700;color:var(--mu);letter-spacing:.6px;text-transform:uppercase}
.r{display:grid;grid-template-columns:26px repeat(3,1fr);gap:3px;align-items:center;font-size:11px;color:var(--mu);margin-top:3px}
.r input{width:100%;height:28px;background:#0d0f12;border:1px solid var(--bd);border-radius:6px;color:var(--tx);padding:0 4px;font:inherit;-webkit-user-select:text;user-select:text}
.f{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;font-size:11px;color:var(--mu)}
.f input[type=range]{width:100%;accent-color:var(--ac)}
.f input[type=color]{width:100%;height:28px;border:1px solid var(--bd);padding:0;background:none;border-radius:6px}
#hud{position:fixed;display:none;background:#000d;border:1px solid var(--ac);color:var(--ac);padding:3px 8px;border-radius:6px;pointer-events:none;font-weight:700;z-index:5}
#toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--pn);border:1px solid var(--bd);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;white-space:nowrap}
#rot{display:none;position:fixed;top:56px;left:70px;background:var(--pn);border:1px solid var(--bd);padding:6px 10px;border-radius:8px;color:var(--mu);pointer-events:none;z-index:4}
@media (orientation:portrait){#rot{display:block}}
</style>
</head>
<body>
<div id="top"><div class="sg" id="modes"></div><div class="gap"></div></div>
<div id="rail"></div>
<div class="pn" id="ctx"></div>
<div class="pn" id="views"></div>
<div class="pn" id="prop">
 <div class="h">Transformação</div><div id="tr"></div>
 <div class="h">Material</div>
 <div class="f">Cor<input type="color" id="col" value="#d1d5db"></div>
 <div class="f">Rugosidade<input type="range" id="rg" min="0" max="1" step=".05" value=".7"></div>
 <div class="f">Metal<input type="range" id="mt" min="0" max="1" step=".05" value="0"></div>
</div>
<div id="hud"></div><div id="toast"></div>
<div id="rot">Gire o aparelho para paisagem</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
const $=s=>document.querySelector(s),V3=THREE.Vector3;
const ic=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={
move:'<path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/>',
rot:'<path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/>',
scale:'<path d="M4 20V10M4 20h10M4 20L20 4M20 4h-6M20 4v6"/>',
orient:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
snap:'<path d="M5 3v8a7 7 0 0 0 14 0V3h-4v8a3 3 0 0 1-6 0V3z"/>',
multi:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
all:'<path d="M4 12l5 5L20 6"/>',
wire:'<path d="M12 3l9 5v8l-9 5-9-5V8zM12 3v18M3 8l9 5 9-5"/>',
smooth:'<circle cx="12" cy="12" r="8"/><path d="M8 12a4 4 0 0 1 8 0"/>',
dup:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
del:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
cube:'<path d="M12 3l9 5v8l-9 5-9-5V8zM12 13l9-5M12 13v8M12 13L3 8"/>',
sphere:'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="9" ry="3.5"/>',
cylinder:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3 3 7 3s7-1.3 7-3V6"/>',
cone:'<path d="M12 3L5 18c0 1.7 3 3 7 3s7-1.3 7-3z"/>',
plane:'<path d="M3 15l9-4 9 4-9 5zM3 15v2l9 5 9-5v-2"/>',
undo:'<path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/>',
redo:'<path d="M15 14l5-5-5-5M20 9H9a5 5 0 0 0 0 10h3"/>',
extrude:'<path d="M12 3v11M8 7l4-4 4 4M5 16h14v5H5z"/>',
subdiv:'<path d="M3 3h18v18H3zM12 3v18M3 12h18"/>',
merge:'<path d="M4 4l8 8M20 4l-8 8M12 12v8"/>',
face:'<path d="M4 18l4-12 12 4-4 10z"/>',
flip:'<path d="M7 7h11l-3-3M17 17H6l3 3"/>',
props:'<path d="M4 6h8M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'};
function ib(label,icon,fn){const b=document.createElement('button');b.className='ib';b.innerHTML=ic(I[icon])+(label?'<span>'+label+'</span>':'');b.onclick=fn;return b}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,2200)}

/* ---------- cena e câmera ---------- */
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
R.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();toast('Contexto WebGL perdido, recarregue a página')});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x14171c);
const cam=new THREE.PerspectiveCamera(50,1,.1,500),root=new THREE.Group();scene.add(root);
scene.add(new THREE.HemisphereLight(0xffffff,0x3b4252,.9));
const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(4,8,5);scene.add(dl);
scene.add(new THREE.GridHelper(40,40,0x3a4250,0x23282f));
{const l=(a,b,c)=>{const g=new THREE.BufferGeometry().setFromPoints([new V3(...a),new V3(...b)]);scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:c})))};l([-20,.002,0],[20,.002,0],0x8f3a3a);l([0,.002,-20],[0,.002,20],0x3a5a8f)}
let tg=new V3(0,.5,0),tgG=tg.clone(),th=.8,ph=1.1,rad=7,thG=th,phG=ph,radG=rad;
function updCam(){const k=.25;th+=(thG-th)*k;ph+=(phG-ph)*k;rad+=(radG-rad)*k;tg.lerp(tgG,k);
 cam.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tg);cam.updateMatrixWorld()}
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
function focus(){let r=3;tgG.set(0,.5,0);const o=S.sel;if(o){if(S.mode=='edit'&&S.vs.size){tgG.copy(selCenter());r=2.5}else{tgG.copy(o.position);o.geometry.computeBoundingSphere();r=o.geometry.boundingSphere.radius*Math.max(o.scale.x,o.scale.y,o.scale.z)*2.8}}radG=Math.max(2,r)}
function view(n){if(n=='f'){thG=0;phG=Math.PI/2}else if(n=='t'){phG=.05}else{thG=Math.PI/2;phG=Math.PI/2}}
const zoom=f=>radG=Math.min(80,Math.max(1,radG*f));
function pan(dx,dy){const k=radG*.0018,r=new V3().setFromMatrixColumn(cam.matrix,0),u=new V3().setFromMatrixColumn(cam.matrix,1);tgG.addScaledVector(r,-dx*k).addScaledVector(u,dy*k)}

/* ---------- estado ---------- */
const S={mode:'obj',tool:'move',orient:0,snap:true,multi:false,sub:'f',sel:null,vs:new Set(),sc:'#ef4444',sz:12,pal:['#ef4444','#f97316','#facc15','#22c55e','#06b6d4','#3b82f6','#a855f7','#ec4899','#ffffff','#9ca3af','#4b5563','#111111']};
const US=[],RS=[],PC=[];let D=null,PT=null,oc=0;
const push=c=>{US.push(c);RS.length=0};
function undo(){const c=US.pop();if(c){c.u();RS.push(c);fix()}}
function redo(){const c=RS.pop();if(c){c.r();US.push(c);fix()}}
function fix(){if(S.sel&&!S.sel.parent)setSel(null);updG();updOv();ui()}

/* ---------- malha poligonal: v = vértices, f = faces (3+ índices), uv = uv por canto da face ---------- */
const cl=p=>({v:p.v.map(a=>a.slice()),f:p.f.map(a=>a.slice()),uv:p.uv?p.uv.map(f=>f.map(c=>c.slice())):null});
function faceN(pm,f){let x=0,y=0,z=0;for(let i=0;i<f.length;i++){const a=pm.v[f[i]],b=pm.v[f[(i+1)%f.length]];x+=(a[1]-b[1])*(a[2]+b[2]);y+=(a[2]-b[2])*(a[0]+b[0]);z+=(a[0]-b[0])*(a[1]+b[1])}return new V3(x,y,z)}
function cen(pm,f){const c=new V3();f.forEach(i=>c.add(new V3(...pm.v[i])));return c.divideScalar(f.length)}
function orient(pm){pm.f=pm.f.map(f=>faceN(pm,f).dot(cen(pm,f))<0?f.slice().reverse():f);return pm}
function mkBox(w,h,d){const x=w/2,y=h/2,z=d/2;return orient({v:[[-x,-y,-z],[x,-y,-z],[x,y,-z],[-x,y,-z],[-x,-y,z],[x,-y,z],[x,y,z],[-x,y,z]],f:[[0,3,2,1],[4,5,6,7],[0,1,5,4],[3,7,6,2],[0,4,7,3],[1,2,6,5]],uv:null})}
function mkSphere(r,sg=12,rg=8){const v=[[0,r,0]];for(let j=1;j<rg;j++){const a=Math.PI*j/rg;for(let i=0;i<sg;i++){const b=2*Math.PI*i/sg;v.push([r*Math.sin(a)*Math.cos(b),r*Math.cos(a),r*Math.sin(a)*Math.sin(b)])}}v.push([0,-r,0]);
 const f=[],ix=(j,i)=>1+(j-1)*sg+(i%sg),L=v.length-1;
 for(let i=0;i<sg;i++)f.push([0,ix(1,i+1),ix(1,i)]);
 for(let j=1;j<rg-1;j++)for(let i=0;i<sg;i++)f.push([ix(j,i),ix(j,i+1),ix(j+1,i+1),ix(j+1,i)]);
 for(let i=0;i<sg;i++)f.push([L,ix(rg-1,i),ix(rg-1,i+1)]);return orient({v,f,uv:null})}
function mkCyl(r,h,sg=12){const v=[],f=[];for(let i=0;i<sg;i++){const a=2*Math.PI*i/sg;v.push([r*Math.cos(a),-h/2,r*Math.sin(a)])}for(let i=0;i<sg;i++){const a=2*Math.PI*i/sg;v.push([r*Math.cos(a),h/2,r*Math.sin(a)])}
 for(let i=0;i<sg;i++){const j=(i+1)%sg;f.push([i,j,sg+j,sg+i])}f.push([...Array(sg).keys()]);f.push([...Array(sg).keys()].map(i=>sg+i));return orient({v,f,uv:null})}
function mkCone(r,h,sg=12){const v=[],f=[];for(let i=0;i<sg;i++){const a=2*Math.PI*i/sg;v.push([r*Math.cos(a),-h/2,r*Math.sin(a)])}v.push([0,h/2,0]);
 for(let i=0;i<sg;i++)f.push([i,(i+1)%sg,sg]);f.push([...Array(sg).keys()]);return orient({v,f,uv:null})}
const MK={cube:()=>mkBox(1,1,1),sphere:()=>mkSphere(.65),cylinder:()=>mkCyl(.5,1.2),cone:()=>mkCone(.6,1.2),plane:()=>mkBox(1.6,.08,1.6)};

/* geometria three a partir da malha (triangulação em leque, normais planas ou suaves) */
function build(o){const pm=o.userData.pm,P=[],N=[],U=[],tf=[];let vn=null;
 if(o.userData.smooth){vn=pm.v.map(()=>new V3());pm.f.forEach(f=>{const n=faceN(pm,f);f.forEach(i=>vn[i].add(n))});vn.forEach(n=>n.normalize())}
 pm.f.forEach((f,fi)=>{const fn=faceN(pm,f).normalize();for(let k=1;k<f.length-1;k++){[0,k,k+1].forEach(c=>{const i=f[c],p=pm.v[i],n=vn?vn[i]:fn;P.push(p[0],p[1],p[2]);N.push(n.x,n.y,n.z);if(pm.uv){const u=pm.uv[fi][c];U.push(u[0],u[1])}});tf.push(fi)}});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));if(pm.uv)g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));
 g.userData.tf=tf;g.computeBoundingSphere();const old=o.geometry;o.geometry=g;if(old)old.dispose()}
function genUV(o){const pm=o.userData.pm,F=pm.f.length,g=Math.ceil(Math.sqrt(F)),cs=1/g;
 pm.uv=pm.f.map((f,fi)=>{const n=faceN(pm,f).normalize(),a=Math.abs(n.y)<.9?new V3(0,1,0):new V3(1,0,0),u=new V3().crossVectors(a,n).normalize(),w=new V3().crossVectors(n,u);
  const pts=f.map(i=>{const p=new V3(...pm.v[i]);return[p.dot(u),p.dot(w)]}),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),mx=Math.min(...xs),my=Math.min(...ys),ext=Math.max(Math.max(...xs)-mx,Math.max(...ys)-my)||1,s=cs*.9/ext,ox=(fi%g)*cs+cs*.05,oy=Math.floor(fi/g)*cs+cs*.05;
  return pts.map(p=>[ox+(p[0]-mx)*s,oy+(p[1]-my)*s])})}
function dropTex(o){if(o.userData.cx){o.material.map=null;o.material.color.set(o.userData.base);o.material.needsUpdate=true;o.userData.cx=null;toast('A pintura foi removida: a malha mudou')}o.userData.pm.uv=null}
const topo=o=>{dropTex(o);build(o);updOv();updG()};
function mkObj(pm,col){const m=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshStandardMaterial({color:col,roughness:.7,metalness:0,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));m.userData.pm=pm;m.name='Obj'+(++oc);build(m);return m}
function setPM(o,p){o.userData.pm=cl(p);build(o);S.vs=new Set([...S.vs].filter(i=>i<p.v.length));updOv();updG()}
function commit(b){const o=S.sel,a=cl(o.userData.pm);push({u:()=>setPM(o,b),r:()=>setPM(o,a)})}
const edgeList=pm=>{const m=new Map();pm.f.forEach(f=>f.forEach((a,k)=>{const b=f[(k+1)%f.length],key=a<b?a+','+b:b+','+a;if(!m.has(key))m.set(key,[Math.min(a,b),Math.max(a,b)])}));return[...m.values()]};

/* ---------- overlays (arestas, vértices, faces) ficam fora do root para não irem no GLB ---------- */
const OV=new THREE.Group();OV.matrixAutoUpdate=false;scene.add(OV);
const AC=0xffb020;
function lines(pts,col,op){if(!pts.length)return;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const l=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:col,transparent:op<1,opacity:op}));l.renderOrder=5;OV.add(l)}
function dots(pts,col,size){if(!pts.length)return;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const p=new THREE.Points(g,new THREE.PointsMaterial({color:col,size,sizeAttenuation:false}));p.renderOrder=6;OV.add(p)}
function updOv(){while(OV.children.length){const c=OV.children.pop();c.geometry.dispose();c.material.dispose()}
 const o=S.sel;if(!o||S.mode=='paint')return;const pm=o.userData.pm,E=edgeList(pm),flat=a=>a.reduce((r,i)=>r.concat(pm.v[i]),[]);
 if(S.mode=='obj'){lines(E.reduce((r,e)=>r.concat(flat(e)),[]),AC,.9);return}
 const se=[],ne=[];E.forEach(e=>(S.vs.has(e[0])&&S.vs.has(e[1])?se:ne).push(...flat(e)));
 lines(ne,0x9aa3b2,.55);lines(se,AC,1);
 const sp=[],np=[];pm.v.forEach((p,i)=>(S.vs.has(i)?sp:np).push(...p));dots(np,0xcfd5df,6);dots(sp,AC,11);
 const sf=selFaces();if(sf.length){const t=[];sf.forEach(fi=>{const f=pm.f[fi];for(let k=1;k<f.length-1;k++)[0,k,k+1].forEach(c=>t.push(...pm.v[f[c]]))});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(t,3));const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:AC,transparent:true,opacity:.4,side:2,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2,depthWrite:false}));m.renderOrder=4;OV.add(m)}}
function selFaces(){const o=S.sel;if(!o||!S.vs.size)return[];const r=[];o.userData.pm.f.forEach((f,i)=>{if(f.every(v=>S.vs.has(v)))r.push(i)});return r}

/* ---------- gizmo: setas dos dois lados, planos, anéis ---------- */
const AX=[new V3(1,0,0),new V3(0,1,0),new V3(0,0,1)],COL=[0xef4444,0x22c55e,0x3b82f6],YEL=0xfde047;
const gm=c=>new THREE.MeshBasicMaterial({color:c,depthTest:false,transparent:true,opacity:.93});
const M=[gm(COL[0]),gm(COL[1]),gm(COL[2]),gm(0xffffff)],HM=new THREE.MeshBasicMaterial({visible:false});
const MP=[0,1,2].map(i=>new THREE.MeshBasicMaterial({color:COL[i],depthTest:false,transparent:true,opacity:.5,side:2}));
const G=new THREE.Group();G.visible=false;scene.add(G);
const gz={move:new THREE.Group(),rot:new THREE.Group(),scale:new THREE.Group()};
for(const k in gz)G.add(gz[k]);
function part(h,g,m,y){const o=new THREE.Mesh(g,m);o.position.y=y||0;o.renderOrder=999;h.add(o)}
function handle(par,i,s,parts){const h=new THREE.Group();parts.forEach(a=>part(h,...a));
 if(i==0)h.rotation.z=-s*Math.PI/2;if(i==1)h.rotation.x=s<0?Math.PI:0;if(i==2)h.rotation.x=s*Math.PI/2;
 par.add(h);h.traverse(o=>{o.userData.axis=i;o.userData.sign=s})}
const cyl=(r,l)=>new THREE.CylinderGeometry(r,r,l,8),bx=s=>new THREE.BoxGeometry(s,s,s);
for(let i=0;i<3;i++){
 for(const s of[1,-1]){

  else tap={x:e.clientX,y:e.clientY}}
 else{tap=null;if(D)cancelDrag();endPaint();const [p,q]=[...ptrs.values()];pd=Math.hypot(p.x-q.x,p.y-q.y);pm_={x:(p.x+q.x)/2,y:(p.y+q.y)/2}}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);
 if(!p){if(e.pointerType=='mouse'&&!D)hl(hitG(e)?.axis??-1);return}

 if(ptrs.size==1){if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>6)tap=null;if(tap)return;
  if(e.buttons&2)pan(dx,dy);else{thG-=dx*.008;phG=Math.min(3.09,Math.max(.05,phG-dy*.008))}}
 else if(ptrs.size==2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  if(pd>0)zoom(pd/d);pan(m.x-pm_.x,m.y-pm_.y);pd=d;pm_=m}});
const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
 if(D){const t=!D.moved&&D.free;endDrag();if(t&&e.type=='pointerup')tapSel(e)}else if(PT)endPaint();else if(tap&&e.type=='pointerup')tapSel(e);tap=null};

{const t=$('#top');t.appendChild(ib('','undo',undo));t.appendChild(ib('','redo',redo));

 const add=(l,i,f,on)=>{const b=ib(l,i,f);if(on)b.classList.add('on');c.appendChild(b)},sp=()=>{const d=document.createElement('div');d.className='sep';c.appendChild(d)};

  add('Duplicar','dup',dupObj);add('Excluir','del',delObj);add('Suave','smooth',toggleSmooth,S.sel&&S.sel.userData.smooth);add('Grade','wire',toggleWire,S.sel&&S.sel.material.wireframe)}
 else if(S.mode=='edit'){const g=document.createElement('div');g.className='sg';
  [['v','Vértice'],['e','Aresta'],['f','Face']].forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;if(S.sub==k)b.className='on';b.onclick=()=>{S.sub=k;renderCtx()};g.appendChild(b)});c.appendChild(g);sp();
  add('Somar','multi',()=>{S.multi=!S.multi;renderCtx()},S.multi);add('Tudo','all',selAll);sp();
  add('Extrudar','extrude',extrude);add('Dividir','subdiv',subdiv);add('Mesclar','merge',merge);add('Criar face','face',fillFace);add('Inverter','flip',flip);add('Apagar','del',delF)}
 else{S.pal.forEach(col=>{const b=document.createElement('button');b.className='sw'+(S.sc==col?' on':'');b.style.background=col;b.onclick=()=>{S.sc=col;renderCtx()};c.appendChild(b)});
  const ci=document.createElement('input');ci.type='color';ci.value=S.sc;ci.oninput=e=>{S.sc=e.target.value};ci.onchange=renderCtx;c.appendChild(ci);sp();
  const l=document.createElement('label');l.className='sl';l.innerHTML='Tamanho<input type="range" min="2" max="40" value="'+S.sz+'">';l.querySelector('input').oninput=e=>S.sz=+e.target.value;c.appendChild(l);sp();add('Limpar','del',clearPaint)}}

/* ---------- exportar GLB (com a pintura embutida) ---------- */
function crc(u){let c,t=crc.t;if(!t){t=crc.t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}c=-1;for(let i=0;i<u.length;i++)c=t[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0}
function zip(name,u8){const n=new TextEncoder().encode(name),c=crc(u8),L=u8.length,h=new DataView(new ArrayBuffer(30)),d=new DataView(new ArrayBuffer(46)),e=new DataView(new ArrayBuffer(22));
 h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,c,true);h.setUint32(18,L,true);h.setUint32(22,L,true);h.setUint16(26,n.length,true);
 d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint32(16,c,true);d.setUint32(20,L,true);d.setUint32(24,L,true);d.setUint16(28,n.length,true);
 e.setUint32(0,0x06054b50,true);e.setUint16(8,1,true);e.setUint16(10,1,true);e.setUint32(12,46+n.length,true);e.setUint32(16,30+n.length+L,true);
 return new Blob([h,n,u8,d,n,e],{type:'application/zip'})}
/* no artifact usa a capability downloads (zip); no arquivo local baixa direto o .glb */
async function out(ext,u8){const dls=window.claude?await claude.use('downloads'):null;
 try{if(dls){await dls.save({filename:'modelo-'+ext+'.zip',data:zip('modelo.'+ext,u8)});toast('Extraia o modelo.'+ext+' do zip')}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u8]));a.download='modelo.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('modelo.'+ext+' exportado')}}
 catch(e){if(!e||e.code!='declined')toast('Falha ao exportar')}}
function exportGLB(){if(!root.children.length){toast('Nada para exportar');return}
 new THREE.GLTFExporter().parse(root,res=>out('glb',new Uint8Array(res)),{binary:true})}
